<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel de Vacinação</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #e3f2fd, #ffffff);
    margin: 0;
    padding: 20px;
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    max-width: 1100px;
    margin: 0 auto;
}

.card {
    background: white;
    padding: 20px;
    width: 300px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

input, select, button {
    margin: 5px 0;
    padding: 8px;
    width: 100%;
}

button {
    cursor: pointer;
    background: #1976d2;
    color: ciano;
    border: none;
    border-radius: 6px;
}

/* tabela */
#historico table {
    width: 100%;
    border-collapse: collapse;
}

#historico th, #historico td {
    border: 1px solid #ccc;
    padding: 10px;
}

#historico th {
    background: #1976d2;
    color: white;
}

/* popup */
#popup {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: none;
    justify-content: center;
    align-items: center;
}

.popup-content {
    background: white;
    padding: 20px;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">
        <h3>Cadastro</h3>
        <input id="nome" placeholder="Nome">
        <input id="idade" placeholder="Idade">
        <input id="data" type="date">
        <input id="cpf" placeholder="CPF">
        <button onclick="cadastrarPaciente()">Cadastrar</button>
    </div>

    <div class="card">
        <h3>Selecionar Paciente</h3>
        <select id="pacientes"></select>
    </div>

    <div class="card">
        <h3>Agendar</h3>
        <select id="vacinas"></select>
        <input id="dataVacina" type="date">
        <input id="local" placeholder="Local">
        <input id="hora" type="time">
        <button onclick="agendarVacina()">Agendar</button>
    </div>

    <div class="card" style="width:100%;">
        <h3>Histórico</h3>
        <button onclick="mostrarHistorico()">Atualizar</button>
        <div id="historico"></div>
    </div>

</div>

<div id="popup">
    <div class="popup-content">
        <p id="popup-text"></p>
        <button onclick="fecharPopup()">OK</button>
    </div>
</div>

<script>

let pacientes = JSON.parse(localStorage.getItem("pacientes")) || [];
let historico = JSON.parse(localStorage.getItem("historico")) || [];

const vacinaNomes = [
    "BCG","Hepatite B","Pentavalente","Poliomielite",
    "Febre Amarela","Triplice Viral","Covid-19",
    "HPV","Influenza","DTP"
];

window.onload = function() {
    carregarVacinas();
    atualizarListaPacientes();
};

function carregarVacinas() {
    const select = document.getElementById("vacinas");
    vacinaNomes.forEach((v, i) => {
        let opt = document.createElement("option");
        opt.value = i;
        opt.innerText = v;
        select.appendChild(opt);
    });
}

function atualizarListaPacientes() {
    let select = document.getElementById("pacientes");
    select.innerHTML = "";

    pacientes.forEach((p, i) => {
        let opt = document.createElement("option");
        opt.value = i;
        opt.innerText = `${p.nome} (${p.cpf})`;
        select.appendChild(opt);
    });
}

function formatarData(e) {
    if (!e) return "Data inválida";
    let partes = e.split("-");
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
}

function formatarCPF(e) {
    let n = e.replace(/\D/g, "").slice(0,11);
    return n.length === 11 
        ? `${n.slice(0,3)}.${n.slice(3,6)}.${n.slice(6,9)}-${n.slice(9)}`
        : null;
}

function mostrarPopup(msg) {
    document.getElementById("popup-text").innerText = msg;
    document.getElementById("popup").style.display = "flex";
}

function fecharPopup() {
    document.getElementById("popup").style.display = "none";
}

function cadastrarPaciente() {
    let nome = document.getElementById("nome").value.trim();
    let idade = parseInt(document.getElementById("idade").value);
    let data = document.getElementById("data").value;
    let cpf = formatarCPF(document.getElementById("cpf").value);

    if (!nome || !cpf) {
        mostrarPopup("Preencha nome e CPF válido!");
        return;
    }

    pacientes.push({
        nome,
        idade,
        dataNascimento: formatarData(data),
        cpf
    });

    localStorage.setItem("pacientes", JSON.stringify(pacientes));
    atualizarListaPacientes();

    document.getElementById("nome").value = "";
    document.getElementById("idade").value = "";
    document.getElementById("data").value = "";
    document.getElementById("cpf").value = "";

    mostrarPopup("Paciente cadastrado!");
}

function agendarVacina() {
    let pacienteIdx = document.getElementById("pacientes").value;
    if (pacienteIdx === "") {
        mostrarPopup("Selecione um paciente!");
        return;
    }

    let vacinaIdx = document.getElementById("vacinas").value;
    let data = formatarData(document.getElementById("dataVacina").value);
    let local = document.getElementById("local").value;
    let hora = document.getElementById("hora").value;

    if (!data || !local || !hora) {
        mostrarPopup("Preencha todos os campos!");
        return;
    }

    historico.push({
        paciente: pacientes[pacienteIdx].nome,
        vacina: vacinaNomes[vacinaIdx],
        data,
        hora,
        local,
        status: "Agendada"
    });

    localStorage.setItem("historico", JSON.stringify(historico));

    document.getElementById("dataVacina").value = "";
    document.getElementById("local").value = "";
    document.getElementById("hora").value = "";

    mostrarPopup("Vacina agendada!");
}

function mostrarHistorico() {
    let div = document.getElementById("historico");

    if (historico.length === 0) {
        div.innerHTML = "Nenhuma vacina";
        return;
    }

    let tabela = `<table>
    <tr>
        <th>#</th>
        <th>Paciente</th>
        <th>Vacina</th>
        <th>Data</th>
        <th>Hora</th>
        <th>Local</th>
        <th>Status</th>
    </tr>`;

    historico.forEach((v,i)=>{
        tabela += `<tr>
            <td>${i+1}</td>
            <td>${v.paciente}</td>
            <td>${v.vacina}</td>
            <td>${v.data}</td>
            <td>${v.hora}</td>
            <td>${v.local}</td>
            <td>${v.status}</td>
        </tr>`;
    });

    tabela += `</table>`;
    div.innerHTML = tabela;
}

</script>

</body>
</html>
